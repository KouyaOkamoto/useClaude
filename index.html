<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>useClaude おもちゃ箱</title>
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #222;
      --muted: #777;
      --card: #fff;
      --border: #e4e4de;
      --accent: #d9774b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1b1a;
        --fg: #eee;
        --muted: #999;
        --card: #262624;
        --border: #3a3a37;
        --accent: #e8915f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .lead { margin: 0 0 32px; color: var(--muted); }
    ul.toys {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    ul.toys a {
      display: block;
      height: 100%;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    ul.toys a:hover { border-color: var(--accent); transform: translateY(-2px); }
    .toy-title, .toy-desc { overflow-wrap: anywhere; }
    .toy-title { margin: 0 0 4px; font-weight: 600; }
    .toy-desc { margin: 0; color: var(--muted); font-size: .9rem; }
    .empty { color: var(--muted); }
    footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>useClaude おもちゃ箱</h1>
    <p class="lead">Claude Code で作った小さな Web おもちゃの一覧です。</p>

    <ul class="toys" id="toys"></ul>
    <p class="empty" id="empty" hidden>まだおもちゃはありません。</p>

    <footer>
      <a href="https://github.com/KouyaOkamoto/useClaude">GitHub</a>
    </footer>
  </main>

  <script>
    // おもちゃを追加したらここに1行足す（path は toys/ 以下のディレクトリ）
    const TOYS = [
      { path: "toys/tilt-maze/", title: "傾き迷路", description: "ボードを傾けて玉をゴールへ。穴に落ちないように。" },
      { path: "toys/particles/", title: "粒子あそび", description: "大量の粒を引き寄せて、はじく。JavaScript と WebAssembly の速さ比べつき。" },
      { path: "toys/life/", title: "ライフゲーム", description: "なぞって細胞を置く。64ビット演算の WebAssembly と JavaScript の速さ比べつき。" },
      { path: "toys/campfire/", title: "焚き火", description: "ゆらめく炎を眺めて、小さくなったら薪をくべる。ゲームオーバーなし。" },
      { path: "toys/bonsai/", title: "盆栽", description: "放っておいても育つ盆栽。水やりと剪定で整えて、作品を図鑑に残そう。" },
      { path: "toys/voxel/", title: "ボクセル世界", description: "歩いた先にどこまでも生成される世界。地形づくりは Rust の WebAssembly で。" },
      { path: "toys/planets/", title: "星めぐり", description: "無数の惑星を巡って景色を眺める旅。空も大地も植物も、星ごとに生成。" },
      { path: "toys/diorama/", title: "朝霧の湖畔", description: "小さな箱庭をどこまでリアルにできるか。霧・光の筋・映り込みを一つずつ切り替えて見比べられる。" },
      { path: "toys/tower-defense/", title: "お城を守れ", description: "塔を建てて敵からお城を守るタワーディフェンス。全10ステージ、能力を持つ敵や中ボス・ボスも。3D モデルは Kenney のアセット。" },
      { path: "toys/webcontainers/", title: "WebContainers 検証", description: "ブラウザの中で Node.js を動かす実験。Vite + React を npm install して起動し、編集がその場でプレビューに反映される。" },
      { path: "toys/browser-rest-api/", title: "ブラウザ内 REST API", description: "サーバーなしで動く REST API。Service Worker が api/* へのリクエストを受け、データは IndexedDB に保存する。" },
      { path: "toys/spring-on-cheerpj/", title: "Spring on CheerpJ", description: "ブラウザ内の Java（CheerpJ）で Spring Boot を動かせるか、段階ごとに確かめる検証キット。サーバーなしで REST API まで応答する。" },
      { path: "toys/spring-sw-bridge/", title: "ブラウザ内 Spring Boot REST API", description: "fetch('api/todos') に、ブラウザの中で動く Spring Boot が答える。Service Worker がリクエストを受け、CheerpJ 上の Spring MVC へ転送する。" },
      { path: "toys/spring-kakeibo/", title: "家計簿（ブラウザ内 Spring Boot）", description: "Spring Boot + JPA + H2 がブラウザの中で動く家計簿。データはこのブラウザの中にだけ保存され、リロードしても残る。バックアップと CSV にも対応。" },
      { path: "toys/v86-link/", title: "ブラウザ内 Linux を LAN でつなぐ（ハブ / スイッチ）", description: "エミュレータ v86 で Linux を 2〜8 台動かし、仮想のハブ / L2 スイッチでつなぐ。ping・HTTP・TCP のほか、ハブなら盗聴できてスイッチではできないこと、MAC テーブルの学習と MAC フラッディングを試せる。" },
    ];

    const list = document.getElementById("toys");
    for (const toy of TOYS) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = toy.path;
      const title = document.createElement("p");
      title.className = "toy-title";
      title.textContent = toy.title;
      const desc = document.createElement("p");
      desc.className = "toy-desc";
      desc.textContent = toy.description ?? "";
      a.append(title, desc);
      li.append(a);
      list.append(li);
    }
    document.getElementById("empty").hidden = TOYS.length > 0;
  </script>
</body>
</html>
