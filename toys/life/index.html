<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ライフゲーム</title>
  <style>
    :root {
      --bg: #06080d;
      --fg: #f4f1ea;
      --muted: #a8a59e;
      --panel: rgba(28, 30, 38, .85);
      --accent: #e8915f;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      image-rendering: pixelated;
      touch-action: none;
    }
    .pill {
      background: var(--panel);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .9rem;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      pointer-events: none;
    }
    #hud a { pointer-events: auto; color: var(--fg); text-decoration: none; }
    #stats { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #controls {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 16px max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #hint { color: var(--muted); font-size: .85rem; transition: opacity .6s; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .group {
      pointer-events: auto;
      display: flex;
      background: var(--panel);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
    }
    .group button {
      font: inherit;
      font-size: .9rem;
      color: var(--fg);
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .group button[aria-pressed="true"] { background: var(--accent); color: #1d2330; font-weight: 600; }
    .group button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <a class="pill" href="../../">← 一覧</a>
    <span class="pill" id="stats">読み込み中…</span>
  </div>
  <div id="controls">
    <span id="hint">なぞると細胞が生まれる</span>
    <div class="group" id="engines">
      <button type="button" data-engine="js">JavaScript</button>
      <button type="button" data-engine="wasm" disabled>WebAssembly</button>
    </div>
    <div class="row">
      <div class="group" id="speeds">
        <button type="button" data-speed="1">×1</button>
        <button type="button" data-speed="10">×10</button>
        <button type="button" data-speed="100">×100</button>
        <button type="button" data-speed="500">×500</button>
      </div>
      <div class="group">
        <button type="button" id="randomize">ランダム</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { JsLife, loadWasm } from "./engine.js";

    const CELL = 2;          // 1マスの大きさ (CSS px)
    const DENSITY = 0.3;     // ランダムに置くときの生きたマスの割合
    const BRUSH = 6;         // なぞったときに細胞が生まれる半径（マス）
    const FADE = 0.9;        // 死んだマスの残光の残り具合

    // ImageData の画素を Uint32Array で書くときの色 (0xAABBGGRR)
    const rgb = (r, g, b) => (0xff000000 | b << 16 | g << 8 | r) >>> 0;
    const ALIVE = rgb(255, 230, 154);
    const BG = [6, 8, 13];
    const TRAIL = [90, 50, 160];
    const GLOW = Array.from({ length: 256 }, (_, v) =>
      rgb(...BG.map((c, i) => Math.round(c + (TRAIL[i] - c) * (v / 255) ** 1.5))));

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const stats = document.getElementById("stats");
    const hint = document.getElementById("hint");

    const engines = { js: JsLife, wasm: null };
    let engine = "js";
    let speed = 10;          // 1フレームで進める世代数
    let life = null;
    let image, pixels, glow;

    // 列数はエンジンの都合で 64 の倍数にする。はみ出した分は画面の外
    function gridSize() {
      return {
        cols: Math.ceil(innerWidth / CELL / 64) * 64,
        rows: Math.ceil(innerHeight / CELL),
      };
    }

    // 盤面はどちらのエンジンも同じ並びなので、作り直すときは重なる部分をコピーする
    function rebuild({ keep = true } = {}) {
      const { cols, rows } = gridSize();
      const old = life;
      life = new engines[engine](cols, rows);
      if (old && keep) {
        const src = old.cells, dst = life.cells;
        const sw = old.cols / 32, dw = cols / 32;
        for (let r = 0; r < Math.min(rows, old.rows); r++) {
          dst.set(src.subarray(r * sw, r * sw + Math.min(sw, dw)), r * dw);
        }
      } else {
        randomize();
      }
      old?.free();

      canvas.width = cols;
      canvas.height = rows;
      canvas.style.width = `${cols * CELL}px`;
      canvas.style.height = `${rows * CELL}px`;
      image = new ImageData(cols, rows);
      pixels = new Uint32Array(image.data.buffer).fill(GLOW[0]);
      glow = new Uint8Array(cols * rows);
      computeMs = 0;
      for (const b of document.querySelectorAll("[data-engine]")) b.setAttribute("aria-pressed", b.dataset.engine === engine);
    }

    function randomize() {
      const cells = life.cells;
      for (let i = 0; i < cells.length; i++) {
        let w = 0;
        for (let b = 0; b < 32; b++) if (Math.random() < DENSITY) w |= 1 << b;
        cells[i] = w;
      }
    }

    function paint(x, y) {
      const cells = life.cells;
      const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
      for (let dy = -BRUSH; dy <= BRUSH; dy++) {
        for (let dx = -BRUSH; dx <= BRUSH; dx++) {
          if (dx * dx + dy * dy > BRUSH * BRUSH || Math.random() > 0.5) continue;
          const c = cx + dx, r = cy + dy;
          if (c < 0 || r < 0 || c >= life.cols || r >= life.rows) continue;
          const i = r * life.cols + c;
          cells[i >> 5] |= 1 << (i & 31);
        }
      }
    }

    // 生きているマスは明るく、死んだマスは少しずつ暗くなる
    function render() {
      const cells = life.cells;
      for (let i = 0, p = 0; i < cells.length; i++) {
        const w = cells[i];
        for (let b = 0; b < 32; b++, p++) {
          if ((w >>> b) & 1) {
            glow[p] = 255;
            pixels[p] = ALIVE;
          } else if (glow[p]) {
            glow[p] = glow[p] * FADE;
            pixels[p] = GLOW[glow[p]];
          }
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    function select(groupId, attr, value) {
      for (const b of document.querySelectorAll(`#${groupId} button`)) b.setAttribute("aria-pressed", b.dataset[attr] === String(value));
    }

    document.getElementById("engines").addEventListener("click", e => {
      const name = e.target.closest("button")?.dataset.engine;
      if (name && engines[name] && name !== engine) {
        engine = name;
        rebuild();
      }
    });
    document.getElementById("speeds").addEventListener("click", e => {
      const n = +e.target.closest("button")?.dataset.speed;
      if (n) {
        speed = n;
        computeMs = 0;
        select("speeds", "speed", speed);
      }
    });
    document.getElementById("randomize").addEventListener("click", randomize);

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const { cols, rows } = gridSize();
        if (cols !== life.cols || rows !== life.rows) rebuild();
      }, 200);
    });

    // --- 入力: なぞった所に細胞を置く ---
    let drawing = null;
    canvas.addEventListener("pointerdown", e => {
      if (drawing !== null) return;
      drawing = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      paint(e.clientX, e.clientY);
      hint.style.opacity = 0;
    });
    canvas.addEventListener("pointermove", e => {
      if (e.pointerId === drawing) paint(e.clientX, e.clientY);
    });
    const stop = e => {
      if (e.pointerId === drawing) drawing = null;
    };
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);

    // --- ループ ---
    let last = performance.now();
    let computeMs = 0, fps = 60, lastStats = 0;

    function frame(now) {
      fps += (1000 / Math.max(now - last, 1) - fps) * 0.05;
      last = now;

      const t0 = performance.now();
      life.step(speed);
      const ms = performance.now() - t0;
      computeMs = computeMs ? computeMs + (ms - computeMs) * 0.05 : ms;

      render();

      if (now - lastStats > 250) {
        lastStats = now;
        const name = engine === "wasm" ? "Wasm" : "JS";
        stats.textContent = `${name} 計算 ${computeMs.toFixed(1)} ms ・ ${Math.round(fps)} fps`;
      }
      requestAnimationFrame(frame);
    }

    // Wasm が読めなくても JS 版で遊べるようにしておく
    try {
      engines.wasm = await loadWasm("life.wasm");
      engine = "wasm";
      document.querySelector('[data-engine="wasm"]').disabled = false;
    } catch (err) {
      console.warn("WebAssembly を読み込めませんでした", err);
    }
    select("speeds", "speed", speed);
    rebuild({ keep: false });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
