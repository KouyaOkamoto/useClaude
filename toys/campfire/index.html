<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>焚き火</title>
  <style>
    :root {
      --bg: #06070b;
      --fg: #f4f1ea;
      --muted: #a8a59e;
      --panel: rgba(20, 18, 16, .7);
      --accent: #e8915f;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { position: fixed; top: 0; left: 0; }
    #fire { mix-blend-mode: screen; pointer-events: none; }
    #front { touch-action: none; }
    .pill {
      background: var(--panel);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .9rem;
      color: var(--fg);
      border: 0;
      font-family: inherit;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    #hud a { text-decoration: none; }
    #reset { cursor: pointer; }
    #hint {
      position: fixed;
      left: 16px;
      color: var(--muted);
      font-size: .85rem;
      pointer-events: none;
      transition: opacity .8s;
    }
    #meter {
      position: fixed;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      pointer-events: none;
    }
    #meter .bar {
      width: 110px;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }
    #meter-fill {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #7a1d0a, #e0521b 45%, #f6a33a 75%, #ffe7a0);
      background-size: 110px 100%;
    }
    #message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="fire"></canvas>
  <canvas id="front"></canvas>
  <div id="hud">
    <a class="pill" href="../../">← 一覧</a>
    <button class="pill" id="reset" type="button">リセット</button>
  </div>
  <div id="hint">薪をドラッグして火にくべよう</div>
  <div id="meter" class="pill"><span>火力</span><div class="bar"><div id="meter-fill"></div></div></div>
  <div id="message" hidden></div>

  <script type="module">
    import { createFire } from "./fire.js";

    // 長さの単位は焚き火の幅 (pit) を 1 としたもの
    const LOG_LEN = 0.75;
    const LOG_R = 0.07;
    const MAX_LOGS = 9;
    const BURN_TIME = 150;      // 1本が燃え尽きるまでのおおよその秒数
    const DROP_RANGE = 0.7;     // 火のまわりのこの範囲に落とすとくべられる

    const sceneCanvas = document.getElementById("scene");
    const fireCanvas = document.getElementById("fire");
    const frontCanvas = document.getElementById("front");
    const scene = sceneCanvas.getContext("2d");
    const front = frontCanvas.getContext("2d");
    const hint = document.getElementById("hint");
    const meterFill = document.getElementById("meter-fill");

    let fire = null;
    try {
      fire = createFire(fireCanvas);
    } catch (err) {
      console.warn(err);
      const message = document.getElementById("message");
      message.hidden = false;
      message.textContent = "この端末では炎を表示できません";
    }

    // --- 配置 ---
    let W, H, dpr, pit, fx, fy, pile, simRect;

    function layout() {
      W = innerWidth;
      H = innerHeight;
      dpr = Math.min(devicePixelRatio, 2);
      pit = Math.min(W * 0.62, H * 0.42, 420);
      fx = W * 0.55;
      fy = H * 0.64;
      pile = { x: Math.max(16 + pit * 0.42, W * 0.16), y: H - Math.max(56, pit * 0.28) - 40 };

      for (const c of [sceneCanvas, frontCanvas]) {
        c.width = W * dpr;
        c.height = H * dpr;
        c.style.width = `${W}px`;
        c.style.height = `${H}px`;
      }
      if (fire) {
        const w = pit * 1.9, h = w * fire.rows / fire.cols;
        simRect = { left: fx - w / 2, bottom: fy + pit * 0.22, w, h, cell: w / fire.cols };
        Object.assign(fireCanvas.style, {
          left: `${simRect.left}px`, top: `${simRect.bottom - h}px`, width: `${w}px`, height: `${h}px`,
        });
        // 炎はぼやけていてよいので、格子の3倍程度の解像度で描いて引き伸ばす
        fireCanvas.width = Math.round(Math.min(w * dpr, fire.cols * 3));
        fireCanvas.height = Math.round(fireCanvas.width * h / w);
      }
      hint.style.top = `${pile.y + pit * 0.13}px`;
    }
    addEventListener("resize", layout);
    layout();

    // --- 焚き火の状態 ---
    // 薪: 位置 (x, y)・角度・燃料 (1 → 0)・着火の度合い (0 → 1)・焦げ具合
    let logs, ember, heat, seedCounter = 1;

    const newLog = (x, y, angle, fuel = 1, ignition = 0) =>
      ({ x, y, angle, fuel, ignition, char: ignition * 0.6, seed: seedCounter++ });

    function reset() {
      logs = [
        newLog(0.02, 0.03, 0.06, 0.75, 1),
        newLog(-0.1, -0.02, -0.42, 0.7, 1),
        newLog(0.1, -0.03, 0.45, 0.7, 1),
      ];
      ember = 0.4;
      heat = 1.1;
      sparks.length = 0;
      fire?.reset();
    }

    function updateFire(dt) {
      let total = 0;
      for (const log of logs) {
        // 火が強いほど早く燃え移る。消えかけでも、熾火があればゆっくり燃え移る
        log.ignition += dt * (0.008 + 0.1 * heat + 0.05 * ember) * (1 - log.ignition);
        log.burn = log.ignition * (0.35 + 0.65 * log.fuel);
        const used = dt * log.burn * (0.7 + 0.3 * heat) / BURN_TIME;
        log.fuel -= used;
        ember += used * 1.5;
        log.char = Math.min(1, log.char + dt * log.ignition * 0.025);
        total += log.burn;
      }
      logs = logs.filter(log => log.fuel > 0.02);
      ember = Math.min(1, ember * Math.exp(-dt * 0.012));
      const target = total * 0.5 + ember * 0.25;
      heat += (target - heat) * (1 - Math.exp(-dt * 1.2));
    }

    // --- 火の粉 ---
    const sparks = [];
    function updateSparks(dt) {
      let n = dt * 5 * heat;
      while (n > Math.random()) {
        n--;
        const burning = logs.filter(l => l.ignition > 0.4);
        if (!burning.length) break;
        const log = burning[Math.random() * burning.length | 0];
        const along = (Math.random() - 0.5) * LOG_LEN * 0.6;
        sparks.push({
          x: fx + (log.x + Math.cos(log.angle) * along) * pit,
          y: fy + (log.y + Math.sin(log.angle) * along - LOG_R) * pit,
          vx: (Math.random() - 0.5) * 40,
          vy: -(60 + Math.random() * 120) * (0.6 + 0.4 * heat),
          life: 1.2 + Math.random() * 2,
          age: 0,
          phase: Math.random() * 10,
        });
      }
      for (const s of sparks) {
        s.age += dt;
        s.px = s.x;
        s.py = s.y;
        s.vx += Math.sin(s.age * 5 + s.phase) * 60 * dt;
        s.vy *= Math.exp(-0.5 * dt);
        s.x += s.vx * dt;
        s.y += s.vy * dt;
      }
      for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].age > sparks[i].life) sparks.splice(i, 1);
    }

    // --- 描画 ---
    // テクスチャは Poly Haven (CC0) のもの。assets/CREDITS.md を参照。
    // 読み込めなかったときは単色で描く
    const loadImage = src => new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
    const [barkImg, rockImg, groundImg, ashImg] = await Promise.all(
      ["bark", "rock", "ground", "ash"].map(name => loadImage(`./assets/${name}.jpg`)));
    // 樹皮の溝 (暗いところ) だけが赤く光る模様。燃えている薪の割れ目に使う
    const emberImg = barkImg && (() => {
      const c = document.createElement("canvas");
      c.width = barkImg.width;
      c.height = barkImg.height;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(barkImg, 0, 0);
      const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
      // 溝全体が光ると電球のようになるので、ぼんやりしたまだら (端がつながる) で間引く
      const N = 6, rand = rng(77), grid = Array.from({ length: N * N }, rand);
      const smooth = t => t * t * (3 - 2 * t);
      const patch = (u, v) => {
        const x = u * N, y = v * N, i = Math.floor(x), j = Math.floor(y);
        const at = (a, b) => grid[((b % N) * N) + (a % N)];
        const sx = smooth(x - i), sy = smooth(y - j);
        const top = at(i, j) + (at(i + 1, j) - at(i, j)) * sx;
        const bottom = at(i, j + 1) + (at(i + 1, j + 1) - at(i, j + 1)) * sx;
        return top + (bottom - top) * sy;
      };
      for (let i = 0; i < d.length; i += 4) {
        const px = (i / 4) % c.width, py = Math.floor(i / 4 / c.width);
        const l = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
        const m = Math.min(1, Math.max(0, (patch(px / c.width, py / c.height) - 0.3) / 0.4));
        const v = Math.min(1, Math.max(0, (0.27 - l) / 0.1)) * m;
        d[i] = 255 * v;
        d[i + 1] = (70 + 120 * v) * v;
        d[i + 2] = 20 * v;
        d[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      return c;
    })();
    const patternCache = new Map();
    function pattern(ctx, img) {
      if (!img) return null;
      let byCtx = patternCache.get(ctx);
      if (!byCtx) patternCache.set(ctx, byCtx = new Map());
      if (!byCtx.has(img)) byCtx.set(img, ctx.createPattern(img, "repeat"));
      return byCtx.get(img);
    }
    // 模様の大きさ (1 枚が何 px になるか) と位置をずらして使う
    function placed(ctx, img, size, ox = 0, oy = 0, squash = 1) {
      const p = pattern(ctx, img);
      if (!p) return null;
      const s = size / img.width;
      p.setTransform(new DOMMatrix().translate(ox, oy).scale(s, s * squash));
      return p;
    }

    function rng(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const css = ([r, g, b], a = 1) => `rgba(${r},${g},${b},${a})`;

    // 薪の本体。shade は暗さ (前面のキャンバスで、照明の重ねがけを受けない薪に使う)
    function drawLog(ctx, x, y, angle, len, r, char, seed, shade = 0) {
      const rand = rng(seed);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const body = () => {
        ctx.beginPath();
        ctx.roundRect(-len / 2, -r, len, r * 2, r * 0.45);
      };

      // 樹皮: 写真の模様を貼り、丸太らしく上を明るく下を暗くする
      body();
      ctx.fillStyle = placed(ctx, barkImg, r * 3.2, rand() * 512, rand() * 512) ?? "#604229";
      ctx.fill();
      ctx.globalCompositeOperation = "multiply";
      const round = ctx.createLinearGradient(0, -r, 0, r);
      round.addColorStop(0, "rgb(235,225,215)");
      round.addColorStop(0.35, "rgb(200,185,170)");
      round.addColorStop(0.8, "rgb(70,60,52)");
      round.addColorStop(1, "rgb(25,20,18)");
      ctx.fillStyle = round;
      body();
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      // 焦げ: 黒くなり、上側に白っぽい灰がのる
      if (char > 0.01) {
        ctx.fillStyle = `rgba(14,10,8,${0.88 * char})`;
        body();
        ctx.fill();
        const ash = ctx.createLinearGradient(0, -r, 0, r * 0.2);
        ash.addColorStop(0, `rgba(150,140,130,${0.35 * char * char})`);
        ash.addColorStop(1, "rgba(150,140,130,0)");
        ctx.fillStyle = ash;
        body();
        ctx.fill();
      }

      // 切り口と年輪
      const cx = len / 2 - r * 0.15;
      const wood = mix([182, 140, 96], [34, 24, 19], char);
      const face = ctx.createRadialGradient(cx - r * 0.1, -r * 0.2, 0, cx, 0, r);
      face.addColorStop(0, css(mix(wood, [255, 230, 190], 0.15)));
      face.addColorStop(1, css(mix(wood, [0, 0, 0], 0.35)));
      ctx.fillStyle = face;
      ctx.beginPath();
      ctx.ellipse(cx, 0, r * 0.38, r * 0.96, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = css(mix(wood, [50, 28, 15], 0.6), 0.55);
      ctx.lineWidth = Math.max(0.5, r * 0.035);
      for (let k = 0.2; k < 0.95; k += 0.12 + rand() * 0.06) {
        ctx.beginPath();
        ctx.ellipse(cx + (rand() - 0.5) * r * 0.03, 0, r * 0.38 * k, r * 0.96 * k, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // 乾燥でできる放射状のひび
      ctx.strokeStyle = css(mix(wood, [30, 18, 10], 0.7), 0.6);
      for (let i = 0; i < 3; i++) {
        const a = rand() * Math.PI * 2, k = 0.4 + rand() * 0.5;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r * 0.06, Math.sin(a) * r * 0.15);
        ctx.lineTo(cx + Math.cos(a) * r * 0.38 * k, Math.sin(a) * r * 0.96 * k);
        ctx.stroke();
      }

      if (shade > 0) {
        // 火の色の光を掛け合わせて、場面の照明と色味をそろえる
        const k = 1 - shade;
        ctx.globalCompositeOperation = "multiply";
        ctx.fillStyle = `rgb(${255 * k | 0},${200 * k | 0},${160 * k | 0})`;
        body();
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx, 0, r * 0.38, r * 0.96, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.restore();
    }

    // 燃えている薪の割れ目と下側の赤い光。照明の後に足すので、暗い中でも光って見える
    function drawLogGlow(ctx, x, y, angle, len, r, glow, seed, flick) {
      if (glow < 0.01) return;
      const rand = rng(seed);
      const bark = [rand() * 512, rand() * 512];
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const under = ctx.createLinearGradient(0, -r, 0, r);
      under.addColorStop(0.25, "rgba(255,90,20,0)");
      under.addColorStop(1, `rgba(255,105,30,${0.6 * glow * flick})`);
      ctx.fillStyle = under;
      ctx.beginPath();
      ctx.roundRect(-len / 2, -r, len, r * 2, r * 0.45);
      ctx.fill();

      // 樹皮の溝が赤く光る (本体と同じ位置に模様を合わせる)
      const ember = placed(ctx, emberImg, r * 3.2, bark[0], bark[1]);
      if (ember) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(-len / 2, -r, len, r * 2, r * 0.45);
        ctx.clip();
        ctx.globalAlpha = Math.min(1, glow * flick * 0.95);
        ctx.fillStyle = ember;
        ctx.fillRect(-len / 2, -r, len, r * 2);
        // 下側ほど熱い
        ctx.globalAlpha = Math.min(1, glow * flick * 0.6);
        ctx.fillRect(-len / 2, 0, len, r);
        ctx.restore();
      }
      // 切り口の縁が赤く燃える
      const cx = len / 2 - r * 0.15;
      ctx.strokeStyle = `rgba(255,90,25,${0.5 * glow * flick})`;
      ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath();
      ctx.ellipse(cx, 0, r * 0.34, r * 0.88, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 石の並び（焚き火を囲む楕円）。輪郭は少しでこぼこにする
    const stones = Array.from({ length: 14 }, (_, i) => {
      const rand = rng(1000 + i);
      const a = (i / 14) * Math.PI * 2 + rand() * 0.15;
      const bumps = Array.from({ length: 9 }, () => 0.8 + rand() * 0.3);
      return {
        a, w: 0.075 + rand() * 0.035, h: 0.05 + rand() * 0.025, tilt: (rand() - 0.5) * 0.4,
        bumps, ox: rand() * 512, oy: rand() * 512, tone: 0.8 + rand() * 0.2,
      };
    });

    function stonePath(ctx, s, x, y, w, h) {
      const n = s.bumps.length, pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        // 下側は地面に埋まっているので平らにする
        const k = s.bumps[i];
        pts.push([x + Math.cos(a + s.tilt) * w * k, y + Math.min(Math.sin(a + s.tilt) * h * k, h * 0.55)]);
      }
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % n];
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        i === 0 ? ctx.moveTo(mx, my) : ctx.quadraticCurveTo(x0, y0, mx, my);
      }
      const [x0, y0] = pts[0], [x1, y1] = pts[1];
      ctx.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
      ctx.closePath();
    }

    function drawStone(ctx, s, back) {
      const x = fx + Math.cos(s.a) * pit * 0.58, y = fy + 0.06 * pit + Math.sin(s.a) * pit * 0.18;
      const w = s.w * pit, h = s.h * pit;

      // 接地影
      ctx.save();
      ctx.translate(x, y + h * 0.45);
      ctx.scale(1, 0.3);
      const sh = ctx.createRadialGradient(0, 0, w * 0.5, 0, 0, w * 1.2);
      sh.addColorStop(0, "rgba(0,0,0,.6)");
      sh.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = sh;
      ctx.fillRect(-w * 1.2, -w * 1.2, w * 2.4, w * 2.4);
      ctx.restore();

      stonePath(ctx, s, x, y, w, h);
      ctx.fillStyle = placed(ctx, rockImg, pit * 0.5, s.ox, s.oy) ?? "#4c4944";
      ctx.fill();
      // 奥の石は火に面した手前側が、手前の石は上面だけが照らされる
      ctx.globalCompositeOperation = "multiply";
      const g = ctx.createLinearGradient(0, y - h, 0, y + h * 0.6);
      const t = s.tone;
      const lit = `rgb(${255 * t | 0},${225 * t | 0},${195 * t | 0})`;
      const dim = `rgb(${150 * t | 0},${138 * t | 0},${130 * t | 0})`;
      const dark = `rgb(${55 * t | 0},${50 * t | 0},${48 * t | 0})`;
      if (back) {
        g.addColorStop(0, dim);
        g.addColorStop(0.55, lit);
        g.addColorStop(1, dim);
      } else {
        g.addColorStop(0, lit);
        g.addColorStop(0.45, dim);
        g.addColorStop(1, dark);
      }
      ctx.fillStyle = g;
      stonePath(ctx, s, x, y, w, h);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      // 火の熱で煤けた内側
      ctx.fillStyle = "rgba(10,8,6,.25)";
      stonePath(ctx, s, x + (fx - x) * 0.04, y - h * 0.15 * (back ? -1 : 1), w * 0.8, h * 0.7);
      ctx.fill();
    }

    function drawScene(t, flick) {
      const ctx = scene;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "source-over";

      // 夜空
      const horizon = fy - pit * 0.55;
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, "#04050a");
      sky.addColorStop(1, "#0d0e14");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // 地面: 奥ほどつぶれて見えるよう、縦を縮めた模様を帯ごとに重ねる
      const bands = 6;
      for (let i = 0; i < bands; i++) {
        const y0 = horizon + (H - horizon) * (i / bands) ** 1.6;
        const y1 = horizon + (H - horizon) * ((i + 1) / bands) ** 1.6;
        const size = pit * (0.55 + 0.9 * (i + 0.5) / bands);
        ctx.fillStyle = placed(ctx, groundImg, size, fx, horizon, 0.35 + 0.25 * i / bands) ?? "#2a2018";
        ctx.fillRect(0, y0 - 1, W, y1 - y0 + 2);
      }
      const haze = ctx.createLinearGradient(0, horizon - pit * 0.05, 0, horizon + pit * 0.7);
      haze.addColorStop(0, "#0d0e14");
      haze.addColorStop(0.3, "rgba(13,14,20,.7)");
      haze.addColorStop(1, "rgba(13,14,20,0)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon - pit * 0.05, W, pit * 0.75);

      // 灰の床 (焼けた地面の模様 + 中心ほど白い灰)
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(fx, fy + pit * 0.06, pit * 0.6, pit * 0.2, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = placed(ctx, ashImg, pit * 0.7, fx, fy, 0.45) ?? "#1b1714";
      ctx.fillRect(fx - pit, fy - pit * 0.3, pit * 2, pit * 0.6);
      const ashTint = ctx.createRadialGradient(fx, fy + pit * 0.06, 0, fx, fy + pit * 0.06, pit * 0.6);
      ashTint.addColorStop(0, "rgba(120,112,105,.55)");
      ashTint.addColorStop(0.6, "rgba(40,36,33,.45)");
      ashTint.addColorStop(1, "rgba(20,16,14,0)");
      ctx.fillStyle = ashTint;
      ctx.fillRect(fx - pit, fy - pit * 0.3, pit * 2, pit * 0.6);
      ctx.restore();

      // 奥の石 → 薪 → 手前の石 → 予備の薪の山
      const drawn = [...logs].sort((a, b) => a.y - b.y).map(log => ({
        log,
        x: fx + log.x * pit,
        y: fy + log.y * pit,
        len: LOG_LEN * (0.72 + 0.28 * log.fuel) * pit,
        r: LOG_R * (0.55 + 0.45 * log.fuel) * pit,
      }));
      for (const s of stones) if (Math.sin(s.a) < 0) drawStone(ctx, s, true);
      for (const d of drawn) drawLog(ctx, d.x, d.y, d.log.angle, d.len, d.r, d.log.char, d.log.seed);
      for (const s of stones) if (Math.sin(s.a) >= 0) drawStone(ctx, s, false);
      for (const p of pileLogs) {
        drawLog(ctx, pile.x + p.x * pit, pile.y + p.y * pit, p.angle, LOG_LEN * pit * 0.85, LOG_R * pit, 0, p.seed);
      }

      // 照明: 火を中心に、明るさが距離で落ちていく光を掛け合わせる
      const light = Math.min(heat / 2, 1) * flick;
      const level = Math.min(1, 0.15 + light * 0.85 + ember * 0.25);
      const ly = fy - pit * 0.1;
      const reach = pit * (1.1 + 1.7 * level);
      const lamp = ctx.createRadialGradient(fx, ly, pit * 0.1, fx, ly, reach);
      const c = (r, g, b, k) => `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;
      lamp.addColorStop(0, c(255, 240, 220, 0.4 + 0.6 * level));
      lamp.addColorStop(0.18, c(255, 205, 160, 0.3 + 0.55 * level));
      lamp.addColorStop(0.42, c(220, 140, 95, 0.12 + 0.3 * level));
      lamp.addColorStop(0.7, c(120, 75, 55, 0.08 + 0.12 * level));
      lamp.addColorStop(1, "rgb(50,52,68)");
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = lamp;
      ctx.fillRect(0, 0, W, H);

      // 光るもの: 空気の照り返し・熾火・薪の割れ目
      ctx.globalCompositeOperation = "lighter";
      const glowR = pit * (1.6 + 1.6 * light);
      const glow = ctx.createRadialGradient(fx, fy - pit * 0.15, 0, fx, fy - pit * 0.15, glowR);
      glow.addColorStop(0, `rgba(255,120,40,${0.22 * light})`);
      glow.addColorStop(0.4, `rgba(200,70,20,${0.08 * light})`);
      glow.addColorStop(1, "rgba(120,40,10,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      const e = Math.min(1, ember * 1.3);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(fx, fy + pit * 0.06, pit * 0.5, pit * 0.15, 0, 0, Math.PI * 2);
      ctx.clip();
      const bed = ctx.createRadialGradient(fx, fy + pit * 0.05, 0, fx, fy + pit * 0.05, pit * 0.45);
      bed.addColorStop(0, `rgba(255,100,25,${0.45 * e * flick})`);
      bed.addColorStop(0.6, `rgba(180,40,10,${0.2 * e * flick})`);
      bed.addColorStop(1, "rgba(120,20,5,0)");
      ctx.fillStyle = bed;
      ctx.fillRect(fx - pit, fy - pit * 0.3, pit * 2, pit * 0.6);
      // 灰の中で明滅する熾火の粒
      for (const b of embers) {
        const k = e * (0.5 + 0.5 * Math.sin(t * b.speed + b.phase));
        if (k < 0.05) continue;
        const bx = fx + b.x * pit, by = fy + pit * 0.06 + b.y * pit;
        const gr = ctx.createRadialGradient(bx, by, 0, bx, by, b.r * pit);
        gr.addColorStop(0, `rgba(255,${120 + 80 * k | 0},50,${0.8 * k})`);
        gr.addColorStop(1, "rgba(255,60,10,0)");
        ctx.fillStyle = gr;
        ctx.fillRect(bx - b.r * pit, by - b.r * pit, b.r * pit * 2, b.r * pit * 2);
      }
      ctx.restore();

      for (const d of drawn) {
        const glowAmount = d.log.ignition * (0.35 + 0.65 * Math.min(heat / 1.5, 1));
        const f = 0.8 + 0.2 * Math.sin(t * 9 + d.log.seed * 3) * Math.sin(t * 4.3 + d.log.seed);
        drawLogGlow(ctx, d.x, d.y, d.log.angle, d.len, d.r, glowAmount, d.log.seed, f);
      }
      ctx.globalCompositeOperation = "source-over";
    }

    const embers = Array.from({ length: 22 }, (_, i) => {
      const rand = rng(2000 + i);
      const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * 0.85;
      return {
        x: Math.cos(a) * d * 0.45, y: Math.sin(a) * d * 0.12,
        r: 0.015 + rand() * 0.03, speed: 0.6 + rand() * 2.2, phase: rand() * 10,
      };
    });
    const pileLogs = [
      { x: 0.0, y: 0.05, angle: 0.02, seed: 501 },
      { x: 0.04, y: -0.085, angle: -0.03, seed: 502 },
      { x: -0.03, y: -0.22, angle: 0.04, seed: 503 },
    ];

    function drawFront() {
      const ctx = front;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      for (const s of sparks) {
        const k = 1 - s.age / s.life;
        ctx.strokeStyle = `rgba(255,${150 + 80 * k | 0},70,${k})`;
        ctx.lineWidth = 1 + k;
        ctx.beginPath();
        ctx.moveTo(s.px ?? s.x, s.py ?? s.y);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";

      if (drag) {
        const over = overFire(drag.x, drag.y);
        ctx.strokeStyle = over ? "rgba(255,190,120,.6)" : "rgba(255,255,255,.18)";
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(fx, fy + pit * 0.04, pit * 0.5, pit * 0.17, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // 前面のキャンバスには照明がかからないので、火からの距離に応じて暗くする
        const dist = Math.hypot(drag.x - fx, drag.y - fy) / pit;
        drawLog(ctx, drag.x, drag.y, -0.15, LOG_LEN * pit, LOG_R * pit, 0, drag.seed, Math.min(0.55, 0.1 + dist * 0.25));
      }
    }

    // --- 薪のドラッグ＆ドロップ ---
    let drag = null;

    const overPile = (x, y) =>
      Math.abs(x - pile.x) < pit * 0.45 && y > pile.y - pit * 0.32 && y < pile.y + pit * 0.12;
    const overFire = (x, y) =>
      Math.abs(x - fx) < pit * DROP_RANGE && y > fy - pit * 0.9 && y < fy + pit * 0.35;

    frontCanvas.addEventListener("pointerdown", e => {
      if (drag || !overPile(e.clientX, e.clientY)) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, seed: seedCounter++ };
      frontCanvas.setPointerCapture(e.pointerId);
    });
    frontCanvas.addEventListener("pointermove", e => {
      if (drag && e.pointerId === drag.id) {
        drag.x = e.clientX;
        drag.y = e.clientY;
      }
      frontCanvas.style.cursor = drag ? "grabbing" : overPile(e.clientX, e.clientY) ? "grab" : "";
    });
    const drop = e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (e.type === "pointerup" && overFire(drag.x, drag.y) && logs.length < MAX_LOGS) {
        // 落とした位置の近くに、上に積むように置く
        const x = Math.max(-0.25, Math.min(0.25, (drag.x - fx) / pit));
        const y = Math.max(-0.1, Math.min(0.05, (drag.y - fy) / pit)) - 0.025 * Math.min(logs.length, 5);
        const log = newLog(x, y, (Math.random() - 0.5) * 1.1);
        log.seed = drag.seed;
        logs.push(log);
        hint.style.opacity = 0;
      }
      drag = null;
    };
    frontCanvas.addEventListener("pointerup", drop);
    frontCanvas.addEventListener("pointercancel", drop);

    document.getElementById("reset").addEventListener("click", reset);

    // --- ループ ---
    function fireSources(t) {
      if (!fire) return [];
      const toCell = (x, y) => [(x - simRect.left) / simRect.cell, (simRect.bottom - y) / simRect.cell];
      const sources = [];
      for (const log of logs) {
        if (log.burn < 0.02) continue;
        const half = LOG_LEN * (0.72 + 0.28 * log.fuel) * pit * 0.42;
        const r = LOG_R * (0.55 + 0.45 * log.fuel) * pit;
        const cx = fx + log.x * pit, cy = fy + log.y * pit - r * 0.5;
        const [x1, y1] = toCell(cx - Math.cos(log.angle) * half, cy - Math.sin(log.angle) * half);
        const [x2, y2] = toCell(cx + Math.cos(log.angle) * half, cy + Math.sin(log.angle) * half);
        sources.push({ x1, y1, x2, y2, r: (r * 1.4) / simRect.cell, s: log.burn });
      }
      const [x1, y1] = toCell(fx - pit * 0.32, fy + pit * 0.02);
      const [x2, y2] = toCell(fx + pit * 0.32, fy + pit * 0.02);
      sources.push({ x1, y1, x2, y2, r: (pit * 0.05) / simRect.cell, s: ember * 0.4 });
      return sources;
    }

    let last = performance.now();
    let meter = 0;
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      const t = now / 1000;

      updateFire(dt);
      updateSparks(dt);
      const flick = 0.88 + 0.12 * Math.sin(t * 11.3) * Math.sin(t * 7.1 + 1.3);

      drawScene(t, flick);
      if (fire) {
        fire.step(dt, fireSources(t), t);
        fire.render();
      }
      drawFront();

      meter += (Math.min(heat / 2, 1) * (0.94 + 0.06 * flick) - meter) * (1 - Math.exp(-dt * 3));
      meterFill.style.width = `${(meter * 100).toFixed(1)}%`;
      requestAnimationFrame(frame);
    }

    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
