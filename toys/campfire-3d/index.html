<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>焚き火 3D</title>
  <style>
    :root {
      --bg: #05060a;
      --fg: #f4f1ea;
      --muted: #a8a59e;
      --panel: rgba(20, 18, 16, .7);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }
    .pill {
      background: var(--panel);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .9rem;
      color: var(--fg);
      border: 0;
      font-family: inherit;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    #hud a { text-decoration: none; }
    #reset { cursor: pointer; }
    #hint {
      position: fixed;
      left: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      max-width: calc(100% - 200px);
      color: var(--muted);
      font-size: .85rem;
      pointer-events: none;
      transition: opacity .8s;
    }
    #meter {
      position: fixed;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      pointer-events: none;
    }
    #meter .bar {
      width: 110px;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }
    #meter-fill {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #7a1d0a, #e0521b 45%, #f6a33a 75%, #ffe7a0);
      background-size: 110px 100%;
    }
    #message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      pointer-events: none;
      transition: opacity .6s;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <a class="pill" href="../../">← 一覧</a>
    <button class="pill" id="reset" type="button">リセット</button>
  </div>
  <div id="hint">薪の山をタップして火にくべよう。ドラッグで見回す</div>
  <div id="meter" class="pill"><span>火力</span><div class="bar"><div id="meter-fill"></div></div></div>
  <div id="message">読み込み中…</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { GroundedSkybox } from "three/addons/objects/GroundedSkybox.js";
    import { createFlame, createSparks, createSmoke } from "./flame.js";

    // 長さの単位はメートル
    const LOG_LEN = 0.55;
    const LOG_R = 0.055;
    const MAX_LOGS = 9;
    const BURN_TIME = 150;   // 1本が燃え尽きるまでのおおよその秒数
    const PIT_FLOOR = 0.04;  // 焚き火台の中の地面の高さ

    const message = document.getElementById("message");
    const hint = document.getElementById("hint");
    const meterFill = document.getElementById("meter-fill");

    // --- レンダラーとカメラ ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07080d, 0.05);
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
    camera.position.set(0, 1.75, 2.9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.35, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 1.4;
    controls.maxDistance = 7;
    controls.minPolarAngle = 0.25;
    controls.maxPolarAngle = 1.48;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.7, 0.55, 0.85);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    function resize() {
      const w = innerWidth, h = innerHeight;
      camera.aspect = w / h;
      // 縦長の画面では引いて全体を入れる
      camera.fov = w < h ? 62 : 50;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloom.setSize(w / 2, h / 2);
    }
    addEventListener("resize", resize);
    resize();

    // --- アセットの読み込み (すべて Poly Haven, CC0。assets/CREDITS.md を参照) ---
    const manager = new THREE.LoadingManager();
    const textureLoader = new THREE.TextureLoader(manager);
    const gltfLoader = new GLTFLoader(manager);
    const loaded = new Promise(resolve => { manager.onLoad = resolve; });
    manager.onError = url => console.warn("読み込みに失敗:", url);

    const tex = (name, srgb, repeat) => {
      const t = textureLoader.load(`./assets/textures/${name}.jpg`);
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      if (repeat) t.repeat.set(...repeat);
      t.anisotropy = 4;
      return t;
    };
    const sky = textureLoader.load("./assets/textures/sky.jpg");
    sky.mapping = THREE.EquirectangularReflectionMapping;
    sky.colorSpace = THREE.SRGBColorSpace;
    const barkMap = tex("bark_diff", true, [1, 1.4]);
    const barkNormal = tex("bark_nor", false, [1, 1.4]);
    const groundMap = tex("ground_diff", true, [9, 9]);
    const groundNormal = tex("ground_nor", false, [9, 9]);
    const groundRough = tex("ground_rough", false, [9, 9]);
    const ashMap = tex("ash_diff", true, [1.5, 1.5]);

    const models = {};
    for (const name of ["stone_fire_pit", "tree_stump_01", "wooden_axe_02", "rock_moss_set_01"]) {
      gltfLoader.load(`./assets/models/${name}/${name}.gltf`, gltf => { models[name] = gltf.scene; });
    }

    // --- 空と地面 ---
    // 空の写真の地面部分をお椀状に投影し、遠くの木立と地面がつながって見えるようにする
    const skybox = new GroundedSkybox(sky, 1.6, 60);
    skybox.position.y = 1.6 - 0.01;
    skybox.material.color.setScalar(0.3);
    skybox.material.fog = false;
    scene.add(skybox);
    scene.environment = sky;
    scene.environmentIntensity = 0.1;

    // 手前の地面は写真の模様 (法線つき)。外側に向かって空の地面へ溶け込ませる
    const groundFade = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, "#fff");
      grad.addColorStop(0.55, "#fff");
      grad.addColorStop(1, "#000");
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    })();
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(14, 64).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({
        map: groundMap, normalMap: groundNormal, roughnessMap: groundRough,
        normalScale: new THREE.Vector2(1.2, 1.2), alphaMap: groundFade, transparent: true,
      }));
    ground.receiveShadow = true;
    scene.add(ground);

    // 月明かり (空の明るい方向から弱い青白い光)
    const moon = new THREE.DirectionalLight(0x9fb4ff, 0.12);
    moon.position.set(-6, 10, -4);
    scene.add(moon);

    // 焚き火の明かり。影も落とす
    const fireLight = new THREE.PointLight(0xff8a3c, 6, 0, 2);
    fireLight.position.set(0, 0.45, 0);
    fireLight.castShadow = true;
    fireLight.shadow.mapSize.set(1024, 1024);
    fireLight.shadow.bias = -0.004;
    fireLight.shadow.normalBias = 0.02;
    fireLight.shadow.radius = 4;
    fireLight.shadow.camera.near = 0.05;
    fireLight.shadow.camera.far = 25;
    scene.add(fireLight);
    // 影の出ない、熾火の照り返し (石の内側や薪の下を照らす)
    const emberLight = new THREE.PointLight(0xff4a14, 1, 1.6, 2);
    emberLight.position.set(0, 0.12, 0);
    scene.add(emberLight);

    // --- 熾火の床 ---
    // 焼けた地面の写真に、ちらちら光る熾火の模様を重ねる
    const emberBedMap = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = "#000";
      g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 260; i++) {
        const x = Math.random() * 256, y = Math.random() * 256, r = 2 + Math.random() * 9;
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        const k = Math.random();
        grad.addColorStop(0, `rgba(255,${120 + 100 * k | 0},${40 * k | 0},${0.5 + 0.5 * k})`);
        grad.addColorStop(1, "rgba(120,20,0,0)");
        g.fillStyle = grad;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    })();
    const bedFade = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "#fff");
      grad.addColorStop(0.7, "#ccc");
      grad.addColorStop(1, "#000");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const bed = new THREE.Mesh(
      new THREE.CircleGeometry(0.62, 48).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({
        map: ashMap, alphaMap: bedFade, transparent: true, depthWrite: false,
        emissive: 0xffffff, emissiveMap: emberBedMap, emissiveIntensity: 1, roughness: 1,
        polygonOffset: true, polygonOffsetFactor: -2,
      }));
    bed.position.y = 0.005;
    bed.receiveShadow = true;
    scene.add(bed);

    // --- 薪 ---
    // 切り口の年輪
    const endMap = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, "#c9a271");
      grad.addColorStop(0.8, "#a77a4c");
      grad.addColorStop(0.9, "#5a3c24");
      grad.addColorStop(1, "#3a2818");
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      g.strokeStyle = "rgba(90,55,30,.45)";
      for (let r = 8; r < 112; r += 5 + Math.random() * 6) {
        g.lineWidth = 0.8 + Math.random() * 1.2;
        g.beginPath();
        g.ellipse(128 + Math.random() * 2, 128, r, r * (0.97 + Math.random() * 0.06), 0, 0, Math.PI * 2);
        g.stroke();
      }
      g.strokeStyle = "rgba(40,22,10,.6)";
      g.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * Math.PI * 2, l = 40 + Math.random() * 60;
        g.beginPath();
        g.moveTo(128 + Math.cos(a) * 6, 128 + Math.sin(a) * 6);
        g.lineTo(128 + Math.cos(a) * l, 128 + Math.sin(a) * l);
        g.stroke();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();
    // 樹皮の溝 (暗いところ) がまだらに赤く光る模様。樹皮の画像が読めてから作る
    let barkEmberMap = null;
    function makeBarkEmber() {
      const img = barkMap.image;
      const c = document.createElement("canvas");
      c.width = img.width;
      c.height = img.height;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0);
      const data = g.getImageData(0, 0, c.width, c.height), d = data.data;
      const N = 5, grid = Array.from({ length: N * N }, Math.random);
      const sm = t => t * t * (3 - 2 * t);
      const at = (a, b) => grid[(b % N) * N + (a % N)];
      const patch = (u, v) => {
        const x = u * N, y = v * N, i = Math.floor(x), j = Math.floor(y), sx = sm(x - i), sy = sm(y - j);
        const top = at(i, j) + (at(i + 1, j) - at(i, j)) * sx;
        const bottom = at(i, j + 1) + (at(i + 1, j + 1) - at(i, j + 1)) * sx;
        return top + (bottom - top) * sy;
      };
      for (let i = 0; i < d.length; i += 4) {
        const px = (i / 4) % c.width, py = Math.floor(i / 4 / c.width);
        const l = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
        const m = Math.min(1, Math.max(0, (patch(px / c.width, py / c.height) - 0.25) / 0.4));
        const v = Math.min(1, Math.max(0, (0.3 - l) / 0.12)) * (0.25 + 0.75 * m);
        d[i] = 255 * v;
        d[i + 1] = (60 + 140 * v) * v;
        d[i + 2] = 25 * v * v;
        d[i + 3] = 255;
      }
      g.putImageData(data, 0, 0);
      barkEmberMap = new THREE.CanvasTexture(c);
      barkEmberMap.colorSpace = THREE.SRGBColorSpace;
      barkEmberMap.wrapS = barkEmberMap.wrapT = THREE.RepeatWrapping;
      barkEmberMap.repeat.copy(barkMap.repeat);
    }

    // 横たわる丸太 (長さ方向が x 軸)
    const logGeometry = new THREE.CylinderGeometry(1, 1, 1, 16, 4).rotateZ(Math.PI / 2);
    // 端を少しすぼめ、表面をでこぼこにして丸太らしくする
    {
      const p = logGeometry.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        const a = Math.atan2(z, y);
        const k = 1 + 0.05 * Math.sin(a * 3 + x * 5) + 0.03 * Math.sin(a * 7 - x * 9);
        p.setY(i, y * k);
        p.setZ(i, z * k);
      }
      logGeometry.computeVertexNormals();
    }

    function makeLogMesh() {
      const side = new THREE.MeshStandardMaterial({
        map: barkMap, normalMap: barkNormal, roughness: 0.95,
        emissive: 0xffffff, emissiveMap: barkEmberMap, emissiveIntensity: 0,
      });
      const cap = new THREE.MeshStandardMaterial({
        map: endMap, roughness: 0.9, emissive: 0xff5a1a, emissiveIntensity: 0,
      });
      const mesh = new THREE.Mesh(logGeometry, [side, cap, cap]);
      // 向き (y) → 転がり (x) → 傾き (z) の順に効くようにする
      mesh.rotation.order = "YXZ";
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // --- 焚き火の状態 ---
    // 薪: 燃料 (1 → 0)・着火の度合い (0 → 1)・焦げ具合。置き場所は pose
    const fireGroup = new THREE.Group();
    scene.add(fireGroup);
    let logs = [], ember, heat;

    function placeLog(index) {
      // 下の段から井桁のように交差させて積む
      const layer = Math.floor(index / 2) % 4, side = index % 2 ? 1 : -1;
      const yaw = (layer % 2 ? Math.PI / 2 : 0) + (Math.random() - 0.5) * 0.5;
      const off = side * (0.08 + Math.random() * 0.05);
      return {
        x: Math.cos(yaw + Math.PI / 2) * off + (Math.random() - 0.5) * 0.06,
        z: -Math.sin(yaw + Math.PI / 2) * off + (Math.random() - 0.5) * 0.06,
        y: PIT_FLOOR + LOG_R + layer * LOG_R * 1.5,
        yaw,
        tilt: (Math.random() - 0.5) * 0.18,
      };
    }

    function addLog({ fuel = 1, ignition = 0, from = null } = {}) {
      const mesh = makeLogMesh();
      const log = {
        mesh, fuel, ignition, char: ignition * 0.6, burn: 0,
        pose: placeLog(logs.length), seed: Math.random() * 100,
        fly: from ? { from: from.clone(), t: 0, spin: (Math.random() - 0.5) * 6 } : null,
      };
      fireGroup.add(mesh);
      logs.push(log);
      return log;
    }

    function reset() {
      for (const log of logs) disposeLog(log);
      logs = [];
      addLog({ fuel: 0.75, ignition: 1 });
      addLog({ fuel: 0.7, ignition: 1 });
      addLog({ fuel: 0.7, ignition: 1 });
      ember = 0.4;
      heat = 1.1;
      sparks?.clear();
    }

    function disposeLog(log) {
      fireGroup.remove(log.mesh);
      for (const m of new Set(log.mesh.material)) m.dispose();
    }

    function updateFire(dt) {
      let total = 0;
      for (const log of logs) {
        if (log.fly) continue;
        // 火が強いほど早く燃え移る。消えかけでも、熾火があればゆっくり燃え移る
        log.ignition += dt * (0.008 + 0.1 * heat + 0.05 * ember) * (1 - log.ignition);
        log.burn = log.ignition * (0.35 + 0.65 * log.fuel);
        const used = dt * log.burn * (0.7 + 0.3 * heat) / BURN_TIME;
        log.fuel -= used;
        ember += used * 1.5;
        log.char = Math.min(1, log.char + dt * log.ignition * 0.025);
        total += log.burn;
      }
      for (const log of logs) if (log.fuel <= 0.02) disposeLog(log);
      logs = logs.filter(log => log.fuel > 0.02);
      ember = Math.min(1, ember * Math.exp(-dt * 0.012));
      const target = total * 0.5 + ember * 0.25;
      heat += (target - heat) * (1 - Math.exp(-dt * 1.2));
    }

    const charColor = new THREE.Color(0.1, 0.085, 0.075);
    const white = new THREE.Color(1, 1, 1);
    function updateLogMeshes(dt, t, flick) {
      for (const log of logs) {
        const { mesh, pose } = log;
        const len = LOG_LEN * (0.72 + 0.28 * log.fuel);
        const r = LOG_R * (0.55 + 0.45 * log.fuel);
        mesh.scale.set(len, r, r);
        if (log.fly) {
          // 薪の山から放物線を描いて飛んでくる
          log.fly.t = Math.min(1, log.fly.t + dt / 0.7);
          const k = log.fly.t, e = k * k * (3 - 2 * k);
          mesh.position.set(
            log.fly.from.x + (pose.x - log.fly.from.x) * e,
            log.fly.from.y + (pose.y - log.fly.from.y) * e + Math.sin(Math.PI * k) * 0.6,
            log.fly.from.z + (pose.z - log.fly.from.z) * e);
          mesh.rotation.set(log.fly.spin * (1 - e), pose.yaw, pose.tilt * e);
          // 飛んでいる間は影を落とさない (火の真上を通ると一瞬まわりが暗くなるため)
          mesh.castShadow = false;
          if (k >= 1) {
            log.fly = null;
            mesh.castShadow = true;
            for (let i = 0; i < 25; i++) emitSpark(log, 1.5);
          }
        } else {
          // 燃えて細くなると下に沈む
          mesh.position.set(pose.x, Math.max(PIT_FLOOR + r, pose.y - (1 - log.fuel) * 0.06), pose.z);
          mesh.rotation.set(0, pose.yaw, pose.tilt);
        }
        const [side, cap] = mesh.material;
        side.color.copy(white).lerp(charColor, Math.min(1, log.char * 1.5));
        cap.color.copy(white).lerp(charColor, Math.min(1, log.char * 1.6));
        const glow = log.ignition * (0.35 + 0.65 * Math.min(heat / 1.5, 1));
        const f = 0.75 + 0.25 * Math.sin(t * 9 + log.seed * 3) * Math.sin(t * 4.3 + log.seed);
        side.emissiveIntensity = barkEmberMap ? glow * f * 2.2 : 0;
        cap.emissiveIntensity = glow * f * 0.35 * log.char;
      }
    }

    // --- 炎・火の粉・煙 ---
    const flame = createFlame();
    scene.add(flame.mesh);
    const sparks = createSparks(320);
    scene.add(sparks.points);
    const smoke = createSmoke();
    scene.add(smoke.group);
    const wind = new THREE.Vector2(0.12, -0.05);

    const tmp = new THREE.Vector3();
    function emitSpark(log, strength) {
      const along = (Math.random() - 0.5) * LOG_LEN * 0.7;
      tmp.set(along, LOG_R, 0).applyEuler(log.mesh.rotation).add(log.mesh.position);
      sparks.emit(tmp.x, tmp.y, tmp.z, strength);
    }
    function updateSparks(dt) {
      let n = dt * 9 * heat;
      const burning = logs.filter(l => !l.fly && l.ignition > 0.4);
      while (burning.length && n > Math.random()) {
        n--;
        emitSpark(burning[Math.random() * burning.length | 0], heat);
      }
      sparks.update(dt, innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))));
    }

    // --- 薪の山とまわりの小物 ---
    const pile = new THREE.Group();
    pile.position.set(1.45, 0, 0.55);
    pile.rotation.y = -0.35;
    scene.add(pile);
    function buildPile() {
      // 3 段の俵積み: 下 3 本、中 2 本、上 1 本
      const layout = [[-1, 0], [0, 0], [1, 0], [-0.5, 1], [0.5, 1], [0, 2]];
      for (const [i, j] of layout) {
        const m = makeLogMesh();
        m.scale.set(LOG_LEN * (0.92 + Math.random() * 0.12), LOG_R * (0.9 + Math.random() * 0.2), LOG_R);
        m.rotation.set(Math.random() * 6, (Math.random() - 0.5) * 0.12, 0);
        m.position.set((Math.random() - 0.5) * 0.05, LOG_R + j * LOG_R * 1.75, i * LOG_R * 2.05);
        pile.add(m);
      }
    }

    function placeProps() {
      const fit = (obj, scale, x, y, z, ry = 0) => {
        obj.scale.setScalar(scale);
        obj.position.set(x, y, z);
        obj.rotation.y = ry;
        obj.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        scene.add(obj);
        return obj;
      };
      if (models.stone_fire_pit) fit(models.stone_fire_pit, 0.95, 0, 0.18, 0);
      if (models.tree_stump_01) fit(models.tree_stump_01, 0.55, -1.55, 0.1, -0.35, 0.8);
      if (models.wooden_axe_02) {
        const axe = fit(models.wooden_axe_02, 1, 1.2, 0.04, 0.95, 0);
        axe.rotation.set(0, 0.6, Math.PI / 2 - 0.08);
      }
      const rocks = models.rock_moss_set_01;
      if (rocks) {
        // 6 個入りの岩を 1 個ずつ取り出して、まわりに散らす
        const spots = [[-3.4, -2.6, 0.55, 0.3], [3.8, -3.2, 0.7, 1.2], [-4.6, 1.6, 0.45, 2.1],
                       [4.2, 2.3, 0.4, 0.4], [0.6, -4.6, 0.8, 2.8], [-1.8, 4.4, 0.5, 1.7]];
        rocks.children.slice().forEach((rock, i) => {
          const [x, z, s, ry] = spots[i % spots.length];
          rock.position.set(0, 0, 0);
          const holder = new THREE.Group();
          holder.add(rock);
          fit(holder, s, x, 0.05 * s, z, ry);
        });
      }
    }

    // --- 入力: 薪の山をタップすると、薪が 1 本飛んでいく ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let down = null;
    function pileHit(e) {
      pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObject(pile, true)[0];
    }
    renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener("pointerup", e => {
      if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) return;
      down = null;
      const hit = pileHit(e);
      if (!hit || logs.length >= MAX_LOGS) return;
      addLog({ from: hit.point });
      hint.style.opacity = 0;
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (e.buttons) return;
      renderer.domElement.style.cursor = pileHit(e) ? "pointer" : "";
    });
    document.getElementById("reset").addEventListener("click", reset);

    // --- ループ ---
    const clock = new THREE.Clock();
    let meter = 0, time = 0;
    function frame() {
      const dt = Math.min(clock.getDelta(), 1 / 30);
      time += dt;
      const t = time;
      updateFire(dt);
      const flick = 0.85 + 0.15 * Math.sin(t * 11.3) * Math.sin(t * 7.1 + 1.3) + 0.04 * Math.sin(t * 23.7);
      updateLogMeshes(dt, t, flick);
      updateSparks(dt);

      const power = Math.min(heat / 2, 1);
      const size = 0.35 + 0.65 * Math.sqrt(power);
      flame.mesh.scale.set(1.15 * size, 0.35 + 1.35 * power, 1.15 * size);
      flame.mesh.position.set(0, PIT_FLOOR + 0.05 + flame.mesh.scale.y / 2, 0);
      flame.update(camera, t, 0.35 + 0.75 * Math.sqrt(power));

      // 明かりの強さと位置を揺らす
      fireLight.intensity = (0.3 + 7 * power) * flick + 0.6 * ember;
      fireLight.position.set(Math.sin(t * 5.1) * 0.03, 0.5 + 0.2 * power + Math.sin(t * 3.7) * 0.02, Math.cos(t * 4.3) * 0.03);
      emberLight.intensity = 0.4 + 2.5 * ember * flick;
      bed.material.emissiveIntensity = 0.15 + 1.6 * Math.min(1, ember * 1.3) * (0.85 + 0.15 * flick);
      emberBedMap.offset.set(Math.sin(t * 0.21) * 0.02, t * 0.004);

      wind.set(0.12 + Math.sin(t * 0.13) * 0.1, -0.05 + Math.cos(t * 0.17) * 0.08);
      smoke.update(dt, 0.3 + 0.7 * Math.min(1, heat / 1.5), wind);

      controls.update();
      composer.render();

      meter += (power * (0.94 + 0.06 * flick) - meter) * (1 - Math.exp(-dt * 3));
      meterFill.style.width = `${(meter * 100).toFixed(1)}%`;
      requestAnimationFrame(frame);
    }

    await loaded;
    makeBarkEmber();
    buildPile();
    placeProps();
    reset();
    message.style.opacity = 0;
    clock.getDelta();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
